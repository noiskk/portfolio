services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC (Spring AI 사용)
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes   # AOF 영속화 - 재시작 후에도 세션 유지

volumes:
  qdrant_data:
  redis_data:
